# echo config — copy to ~/.config/echo/config.toml and edit.
#
# All keys are optional. Missing keys fall back to defaults below.
# CLI flags (e.g. --wpm) always override config values.

# Default playback speed in words per minute.
# Clamped at runtime to [60, 2000]. Default: 300.
wpm = 350

# Whether playback starts paused (you press space to begin).
# Default: true — gives you a moment to focus on the first word.
start_paused = true

# Enable TTS narration. Uses macOS `say` or Linux `espeak-ng`/`espeak`
# if installed — echo prints a warning and falls back to silent
# playback if no engine is found. Default: false.
narrate = false

# How much to slow down at punctuation so sentence breaks feel natural.
#   off     — every word gets the same duration
#   low     — 2× at . ! ?
#   medium  — 3× at . ! ?, 2× at , ; :   (default)
#   high    — 5× at . ! ?, 3× at , ; :
pauses = "medium"
